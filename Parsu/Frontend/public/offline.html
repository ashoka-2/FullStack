<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Parsu AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080a0f;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            text-align: center;
            padding: 2rem;
        }
        .icon { font-size: 3rem; margin-bottom: 1.5rem; opacity: 0.6; }
        h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { font-size: 0.875rem; color: #a1a1aa; line-height: 1.6; max-width: 340px; }
        button {
            margin-top: 1.5rem;
            padding: 0.625rem 1.5rem;
            background: #20B8CD;
            color: #080a0f;
            font-weight: 700;
            font-size: 0.8125rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p>Parsu AI needs an internet connection to think. We'll reconnect automatically when your network is back.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
