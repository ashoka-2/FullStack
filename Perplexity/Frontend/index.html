<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ═══ Primary SEO ═══════════════════════════════════════════════════════ -->
    <title>Perplexity — AI-Powered Answers, Research & Creativity</title>
    <meta name="description" content="Perplexity is your AI-powered assistant for instant answers, deep research, creative writing, code generation, and social media publishing. Powered by Gemini, Claude, GPT-4 and more." />
    <meta name="keywords" content="AI assistant, Perplexity, AI chat, Gemini AI, Claude AI, GPT-4, research AI, code generation, social media AI, AI writing, creative AI" />
    <meta name="author" content="Perplexity AI" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://perplexity.app/" />

    <!-- ═══ Open Graph (Facebook, LinkedIn, WhatsApp, Telegram) ═══════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Perplexity" />
    <meta property="og:title" content="Perplexity — AI-Powered Answers, Research & Creativity" />
    <meta property="og:description" content="Get instant AI-powered answers, conduct deep research, generate creative content, write code, and publish to social media — all in one place." />
    <meta property="og:url" content="https://perplexity.app/" />
    <meta property="og:image" content="https://perplexity.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Perplexity AI — Your intelligent research and creativity companion" />
    <meta property="og:locale" content="en_US" />

    <!-- ═══ Twitter / X Card ══════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@perplexity_ai" />
    <meta name="twitter:creator" content="@perplexity_ai" />
    <meta name="twitter:title" content="Perplexity — AI-Powered Answers, Research & Creativity" />
    <meta name="twitter:description" content="Get instant AI-powered answers, deep research, code generation, creative writing, and social media publishing — all in one intelligent assistant." />
    <meta name="twitter:image" content="https://perplexity.app/og-image.png" />
    <meta name="twitter:image:alt" content="Perplexity AI interface preview" />

    <!-- ═══ Favicon Stack ════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/perplexity.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ═══ Theme & Mobile ════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#20b8cd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perplexity" />
    <meta name="application-name" content="Perplexity" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ═══ Performance — Preconnect Critical Origins ════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.openai.com" />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />

    <!-- ═══ Google Fonts ══════════════════════════════════════════════════════ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- ═══ Structured Data — JSON-LD ════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://perplexity.app/#app",
          "name": "Perplexity",
          "url": "https://perplexity.app",
          "description": "AI-powered assistant for instant answers, deep research, creative writing, code generation, and social media publishing.",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "AI-powered Q&A",
            "Deep research assistant",
            "Code generation",
            "Creative writing",
            "Social media publishing",
            "Multi-model AI support (Gemini, Claude, GPT-4, Groq)"
          ],
          "screenshot": "https://perplexity.app/og-image.png"
        },
        {
          "@type": "Organization",
          "@id": "https://perplexity.app/#organization",
          "name": "Perplexity AI",
          "url": "https://perplexity.app",
          "logo": {
            "@type": "ImageObject",
            "url": "https://perplexity.app/perplexity.svg"
          },
          "sameAs": [
            "https://twitter.com/perplexity_ai"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://perplexity.app/#website",
          "url": "https://perplexity.app",
          "name": "Perplexity",
          "description": "AI-powered answers, research, creativity, and social media publishing.",
          "publisher": { "@id": "https://perplexity.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://perplexity.app/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
